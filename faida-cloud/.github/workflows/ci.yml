name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 100% line/branch/statement/function coverage on the costing engine
      # is CI-blocking per Phase 3 spec — "a Mama Lishe must be able to
      # trust these numbers." Runs before the general test suite so a
      # coverage regression here fails fast.
      - run: npm run test:costing
      - run: npm test
      # Testcontainers needs Docker, which GitHub's ubuntu-latest runners
      # provide out of the box — no service containers to declare here.
      # CI-blocking per Phase 2 spec: reuse detection, brute-force lockout,
      # rate limiting, device cap, and the RLS proof all live in this run.
      - run: npm run test:auth
      # ≥90% coverage on lib/pos/ and the sync route handlers, CI-blocking
      # per Phase 4 spec. Runs last and takes ~15 minutes on its own — the
      # 500-iteration sync property test (order/duplication/batching/
      # retries never change final ledger state) dominates that time, and
      # is deliberately not shortened: it's the single most important test
      # in this phase, per the brief that specified it.
      - run: npm run test:pos
  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
