# ============================================================
# FAIDA — cloud stack (Docker Compose)
# edge (nginx) · api (Next.js) · cache (redis) · db (postgres)
# monitoring (prometheus, grafana, loki, promtail)
# In production, prefer managed Postgres/Redis and point
# DATABASE_URL / REDIS_URL at them; the local services below
# are for dev / single-VM deployments.
# ============================================================
name: faida

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks: [web, internal]
    depends_on: [api]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      # Docker auto-injects HOSTNAME=<container-id>; Next's standalone
      # server.js binds to that literal value instead of all interfaces,
      # so both the healthcheck and nginx's proxy_pass fail to connect
      # unless this is forced back to 0.0.0.0.
      HOSTNAME: "0.0.0.0"
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      # 127.0.0.1, not localhost: "localhost" resolves ::1 first in this
      # image, and Node's 0.0.0.0 bind is IPv4-only, so the IPv6 attempt
      # gets refused before wget falls back to IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faida}
      POSTGRES_DB: faida
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faida -d faida"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks: [internal]

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes: [loki_data:/loki]
    networks: [internal]

  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [web, internal]
    # Served at grafana.<your-domain> via nginx

networks:
  web:
  internal:

volumes:
  pg_data:
  redis_data:
  prom_data:
  loki_data:
  grafana_data:
  certbot_certs:
