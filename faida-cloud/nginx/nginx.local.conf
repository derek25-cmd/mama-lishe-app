worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/json application/javascript text/css text/plain application/xml;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream api { server api:3000; }
  upstream grafana { server grafana:3000; }

  # ---------------------------------------------------------------
  # LOCAL / NO-DOMAIN VARIANT — plain HTTP only, no TLS.
  # Used via docker-compose.override.yml until a real domain + certbot
  # certs exist. The production config (nginx.conf: 443 blocks, HTTP->
  # HTTPS redirect, per-domain vhosts) is what ships once DNS is live —
  # switch back by deleting docker-compose.override.yml.
  # ---------------------------------------------------------------
  server {
    listen 80 default_server;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api/api/v1/health;
      proxy_set_header Host $host;
    }

    location = /api/v1/metrics { return 404; }

    location /grafana/ {
      proxy_pass http://grafana/;
      proxy_set_header Host $host;
    }

    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
