worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/json application/javascript text/css text/plain application/xml;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream api { server api:3000; }
  upstream grafana { server grafana:3000; }

  server {
    listen 80;
    server_name api.your-domain.com grafana.your-domain.com;
    # certbot http-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name grafana.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/grafana.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.your-domain.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
      proxy_pass http://grafana;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Plain /healthz for uptime checks/load balancers that expect the
    # conventional path; the app itself serves health at /api/v1/health.
    location = /healthz {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api/api/v1/health;
      proxy_set_header Host $host;
    }

    # Prometheus scrapes this over the internal network directly; never expose
    # it publicly through the edge.
    location = /api/v1/metrics { return 404; }

    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
